<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IEEE SoutheastCon 2027 – Paper Acceptance</title>
<meta name="description" content="Tharun Nambi's paper on data leakage in diabetic retinopathy classifiers, accepted for oral presentation at IEEE SoutheastCon 2027.">
<link rel="canonical" href="https://tharunnambi.com/research/southeastcon-2027">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#1F3D2B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght,SOFT@9..144,100..900,0..100&display=swap" rel="stylesheet">
<style>
  :root { --forest: #1F3D2B; --green: #1E5631; --card: #F7F4EA; --cream: #F1EFE4; --ink: #1B1F1C; --body: #3A403B; --muted: #5B635C; --line: rgba(30,86,49,0.25); }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); font-family: 'Source Serif 4', Georgia, serif; font-size: 17px; line-height: 1.6;
    background-color: var(--forest);
    background-image:
      linear-gradient(rgba(241,239,228,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(241,239,228,0.07) 1px, transparent 1px),
      linear-gradient(rgba(241,239,228,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(241,239,228,0.03) 1px, transparent 1px);
    background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
  }
  main { max-width: 860px; margin: 0 auto; padding: 48px 24px 72px; }
  .back { display: inline-block; margin-bottom: 24px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: var(--cream); text-decoration: underline; text-decoration-color: rgba(241,239,228,0.4); text-underline-offset: 3px; }
  .back:hover { text-decoration-color: var(--cream); }
  .panel { background: var(--card); border-radius: 20px; padding: 36px; box-shadow: 0 12px 32px rgba(0,0,0,0.22); }
  .eyebrow { margin: 0 0 6px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--green); }
  h1 { margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-variation-settings: "SOFT" 100; font-size: clamp(26px, 4vw, 34px); line-height: 1.15; }
  figure { margin: 24px 0 0; }
  figure img { display: block; width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); background: #fff; }
  figcaption { margin-top: 14px; color: var(--body); font-size: 16px; }
  figcaption i { color: var(--ink); }
  @media (max-width: 560px) { main { padding: 24px 16px 48px; } .panel { padding: 24px 20px; } }
</style>
</head>
<body>
<main>
  <a class="back" href="/">← Tharun Nambi</a>
  <section class="panel">
    <p class="eyebrow">IEEE SoutheastCon 2027</p>
    <h1>Paper Acceptance</h1>
    <figure>
      <img src="/research/southeastcon-2027/acceptance.png" width="1036" height="1074" alt="Acceptance letter from the IEEE SoutheastCon 2027 Technical Program Committee">
      <figcaption><i>Data Leakage in Diabetic Retinopathy Classifiers for Tele-Ophthalmology Screening: A Code-Level Audit and Controlled Reproduction on APTOS 2019</i>. Accepted for oral presentation.</figcaption>
    </figure>
  </section>
</main>
</body>
</html>
